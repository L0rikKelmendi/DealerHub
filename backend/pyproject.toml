[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B008", "UP046"]  # FastAPI defaults; retain conventional Generic typing

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]  # Set test environment before importing app settings

[tool.coverage.run]
source = ["app"]
omit = ["app/workers/*"]
